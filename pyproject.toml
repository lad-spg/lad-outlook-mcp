[project]
name = "lad-outlook-mcp"
version = "0.1.0"
description = "Schlanker MCP-Server für Outlook / Microsoft 365 (Mails lesen, suchen, Entwürfe, senden, Anhänge) über Microsoft Graph"
readme = "README.md"
requires-python = ">=3.11"
# Bewusst exakt gepinnt: keine ungeprüften Updates von Abhängigkeiten.
dependencies = [
    "mcp==2.3.0",
    "msal==1.39.0",
    "httpx==0.28.1",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
lad-outlook-mcp = "lad_outlook_mcp.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lad_outlook_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
